name: release

# Cloud pipeline for Stable releases. Dispatched by scripts/release.sh (or
# manually from the Actions tab). Everything that used to run on a laptop runs
# here instead, so a dead battery or a dropped connection can no longer strand a
# half-published release. Artifact releases have a pipeline of their own,
# started by a commit - see artifact.yml.
#
# The version is worked out from the release tags (scripts/lib/version.sh) -
# "release" makes the version the latest artifacts lead to stable. The notes
# are the ones given, or else gathered from the commits since the last stable
# release (scripts/lib/changelog.sh), which also become its CHANGELOG.md entry.
#
# Ordering is deliberate: nothing becomes publicly visible until every APK is
# durably stored on GitHub. The release is created as a DRAFT, assets are
# uploaded (with retry), main is pushed, and only then is the draft published —
# which is also what creates the tag, on the release commit.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (release = make the latest artifacts' version stable)
        type: choice
        options: [release, patch, minor, major]
        default: release
      notes:
        description: Release notes (markdown) - empty to gather them from the commits
        type: string
        default: ''
      source_branch:
        description: Branch to merge into main
        type: string
        default: dev

# One release at a time, ever - artifacts included, so each works out its
# version from tags the other has finished writing. Queued rather than
# cancelled — cancelling a run mid-push is exactly the failure mode this
# pipeline exists to eliminate.
concurrency:
  group: release
  cancel-in-progress: false

env:
  MAIN_BRANCH: main
  GRADLE_FILE: app/build.gradle.kts

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Explicit rather than relying on the default: the later steps push to
          # main, which needs the token left in the local git config.
          persist-credentials: true

      # Inputs reach the shell through env, never through ${{ }} interpolation
      # into script text — release notes are free-form user input.
      - name: Merge source branch into main
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SOURCE_BRANCH" != "$MAIN_BRANCH" ]; then
            git fetch origin "$SOURCE_BRANCH"
            git merge --no-edit "origin/${SOURCE_BRANCH}" \
              || { echo "::error::Merge conflict ${SOURCE_BRANCH} → ${MAIN_BRANCH}. Resolve locally and re-run."; exit 1; }
          fi

      - name: Work out the version and notes
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source scripts/lib/version.sh
          source scripts/lib/changelog.sh

          LAST_STABLE="$(version::latest stable)"
          NAME="$(version::next_stable "$BUMP")"
          TAG="v${NAME}"
          # Only a *published* release blocks us; a leftover draft from a failed
          # run is reclaimed when the draft is created.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo absent)" = "false" ]; then
            echo "::error::${TAG} is already published."; exit 1
          fi

          CHANGES="$(changelog::since "${LAST_STABLE:+v${LAST_STABLE}}")"
          CHANGES="${CHANGES:-$'### Changed\n\n- Bug fixes and improvements.'}"
          printf '%s\n' "${NOTES:-$CHANGES}" > "${RUNNER_TEMP}/notes.md"

          version::write_stable "$GRADLE_FILE" "$NAME"
          changelog::add_release CHANGELOG.md "$NAME" "$(date -u +%Y-%m-%d)" "$CHANGES"

          {
            echo "name=${NAME}"
            echo "tag=${TAG}"
            echo "last_stable=${LAST_STABLE}"
          } >> "$GITHUB_OUTPUT"
          echo "✓ ${LAST_STABLE:-nothing} → ${NAME}"

      - name: Build and upload
        id: upload
        uses: ./.github/actions/upload-release
        with:
          version: ${{ steps.version.outputs.name }}
          target: ${{ env.MAIN_BRANCH }}
          notes-file: ${{ runner.temp }}/notes.md
          prerelease: 'false'
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          github-token: ${{ github.token }}

      - name: Write version.json and push main
        id: manifest
        env:
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.upload.outputs.version-code }}
          UNIVERSAL: ${{ steps.upload.outputs.universal }}
        run: |
          set -euo pipefail
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${UNIVERSAL}"

          # Built with jq, not string interpolation — safe against quotes and
          # newlines in the release notes.
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$NAME" \
            --arg apkUrl "$APK_URL" \
            --rawfile notes "${RUNNER_TEMP}/notes.md" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, notes: ($notes | rtrimstr("\n"))}' \
            > version.json

          git add "$GRADLE_FILE" version.json CHANGELOG.md
          git commit -m "release: ${TAG}"
          git push origin "HEAD:${MAIN_BRANCH}"
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"

      # Publishing a draft creates the tag at --target, which now resolves to the
      # release commit pushed above.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --prerelease=false

      # ArchiveTune's notify_user, for releases: whoever is waiting on a fix hears
      # it is out - those told of an artifact on the way included. Never fails the
      # release - it is already out.
      - name: Tell the issues it closes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          LAST_STABLE: ${{ steps.version.outputs.last_stable }}
        run: |
          source scripts/lib/changelog.sh
          for number in $(changelog::referenced_issues "${LAST_STABLE:+v${LAST_STABLE}}" HEAD); do
            gh issue comment "$number" --body "Released in [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})." \
              || echo "::warning::Could not comment on #${number}."
          done

      # dev was merged into main, so main is a descendant of dev and this is a
      # plain fast-forward — no history rewrite, no force push.
      - name: Fast-forward source branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          if [ "$SOURCE_BRANCH" != "$MAIN_BRANCH" ]; then
            git push origin "${MAIN_BRANCH}:refs/heads/${SOURCE_BRANCH}"
          fi

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "### ✓ Released ${TAG}"
            echo ""
            echo "- **APK**: ${{ steps.manifest.outputs.apk_url }}"
            echo "- **Manifest**: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${MAIN_BRANCH}/version.json"
            echo "- **Release**: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
