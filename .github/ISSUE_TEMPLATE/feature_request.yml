name: Feature request
description: Suggest something new, or a change to how something works.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Sona is an offline player for music stored on the device. Streaming, accounts and cloud services are out of scope.
        Check [existing issues](https://github.com/LhacenMed/Sona/issues?q=is%3Aissue) first.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
      placeholder: When I add a whole album to a playlist, I cannot tell which tracks were already in it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, or how other apps handle it.

  - type: textarea
    id: media
    attributes:
      label: Mockups or references
      description: Sketches, screenshots from other apps, or links.
